<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes — drafting.desk</title>
<meta name="description" content="Short write-ups, rendered from markdown.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="mark" href="index.html">drafting<span>.</span>desk</a>
    <nav class="site-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="notes.html">Notes</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div id="notes-list-view">
      <div class="section-head">
        <h2>Notes</h2>
        <span class="count">Short write-ups, kept from getting long</span>
      </div>
      <div id="notes-list">
        <p class="loading">Loading…</p>
      </div>
    </div>

    <div id="notes-post-view" class="note-reader" style="display:none;">
      <a class="back" href="notes.html">&larr; All notes</a>
      <div id="post-content" class="note-body">
        <p class="loading">Loading…</p>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 — built and deployed as a static site.</span>
    <span><a href="contact.html">Get in touch</a></span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="assets/main.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("post");
  const listView = document.getElementById("notes-list-view");
  const postView = document.getElementById("notes-post-view");

  const res = await fetch("content/notes/manifest.json");
  const manifest = await res.json();

  if (slug) {
    const entry = manifest.find((n) => n.slug === slug);
    listView.style.display = "none";
    postView.style.display = "block";
    const target = document.getElementById("post-content");
    if (!entry) {
      target.innerHTML = '<p class="error">No note found with that name.</p>';
      return;
    }
    document.title = entry.title + " — drafting.desk";
    await renderMarkdownInto(entry.file, target);
    target.insertAdjacentHTML(
      "afterbegin",
      `<h1>${entry.title}</h1><div class="date">${entry.date}</div>`
    );
  } else {
    const list = document.getElementById("notes-list");
    const sorted = [...manifest].sort((a, b) => (a.date < b.date ? 1 : -1));
    list.innerHTML = sorted
      .map(
        (n) => `
      <div class="note-row">
        <time>${n.date}</time>
        <div>
          <h3><a href="notes.html?post=${n.slug}">${n.title}</a></h3>
          <p>${n.excerpt}</p>
        </div>
      </div>`
      )
      .join("");
  }
})();
</script>
</body>
</html>
