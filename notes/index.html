<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="../assets/main.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("post");
  const listView = document.getElementById("notes-list-view");
  const postView = document.getElementById("notes-post-view");

  const res = await fetch("../content/notes/manifest.json");
  const manifest = await res.json();

  if (slug) {
    const entry = manifest.find((n) => n.slug === slug);
    listView.classList.add("hidden");
    postView.classList.remove("hidden");
    const target = document.getElementById("post-content");
    if (!entry) {
      target.innerHTML = '<p class="text-rust">No note found with that name.</p>';
      return;
    }
    document.title = entry.title + " — drafting.desk";
    await renderMarkdownInto(entry.file, target);
    target.insertAdjacentHTML(
      "afterbegin",
      `<h1 class="font-serif">${entry.title}</h1><div class="text-muted text-sm not-prose mb-6">${entry.date}</div>`
    );
  } else {
    const list = document.getElementById("notes-list");
    const sorted = [...manifest].sort((a, b) => (a.date < b.date ? 1 : -1));
    list.innerHTML = sorted
      .map(
        (n) => `
      <div class="grid md:grid-cols-[130px_1fr] gap-2 md:gap-6 py-5 border-b border-white/10 last:border-b-0">
        <time class="text-muted text-sm">${n.date}</time>
        <div>
          <h3 class="font-serif text-lg mb-1.5"><a href="?post=${n.slug}" class="hover:text-gold">${n.title}</a></h3>
          <p class="text-muted text-sm">${n.excerpt}</p>
        </div>
      </div>`
      )
      .join("");
  }
})();
</script>
